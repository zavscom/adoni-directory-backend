# Daily scrape at 03:00 IST = 21:30 UTC (India Standard Time, UTC+5:30, no DST).
# checkout@v6 / setup-python@v6 run on Node.js 24 (avoids Node 20 deprecation on runners).
name: scrape-town-data

on:
  schedule:
    - cron: "30 21 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scrape-town-data
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.x
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pipeline
        run: python run_pipeline.py

      - name: Commit and push data if changed
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${TOKEN}@github.com/${REPO}.git"
          git add data/
          if git diff --staged --quiet; then
            echo "No changes under data/"
          else
            TS=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
            git commit -m "Update town data ${TS}"
            git push origin HEAD:main
          fi
